# Seed file for one merchant. Load with:
#   docker compose exec api python -m app.seed merchants/pho37.yaml
#
# `slug` is the upsert key and never changes. Edit anything else and re-run.

slug: pho37
name: Pho 37
category: Vietnamese Restaurant
description: Family-run Vietnamese kitchen serving pho and rice plates.

phone: '+1-604-555-0137'
address: 8100 Ackroyd Rd
city: Richmond
province_state: BC
postal_code: V6X 3K1
country: Canada

# google_review_url is derived from this. Set google_review_url explicitly to
# override, which is needed for listings that use a short g.page link.
google_place_id: ChIJ-b-XikB2hlQRq91JgwcRa9s
status: ACTIVE

# Everything below is the only input the AI gets — there is no customer-supplied
# rating or tags in the MVP, so suggestion quality is bounded by what is written
# here. Vague entries produce generic, interchangeable reviews.
review_context:
  business_summary: >
    Family-owned Vietnamese restaurant in Richmond, open since 2009. Known for
    slow-simmered beef broth, generous portions, and quick weekday lunch
    service. Casual, busy at midday, mostly regulars from nearby offices.

  products:
    - beef pho
    - chicken pho
    - spring rolls
    - vermicelli bowls
    - Vietnamese coffee

  selling_points:
    - broth simmered daily
    - large portions
    - fast weekday lunch service
    - family owned

  approved_keywords:
    - Richmond
    - Vietnamese restaurant
    - pho

  # Drives one-topic-per-suggestion rotation: each card in a batch is asked to
  # cover a different one of these, so the three cards read as distinct rather
  # than as three paraphrases. Needs at least 3 to work well.
  experience_topics:
    - food
    - service
    - atmosphere
    - value

  custom_instructions: >
    Keep it plain and conversational, like a regular customer typing on a
    phone. No marketing language, no exclamation marks, no mention of prices or
    discounts.

  # No approval workflow exists in the MVP; writing this file is the approval.
  is_approved: true
