[project]
name = "smart-reviewer-api"
version = "0.1.0"
description = "Smart Reviewer MVP backend"
requires-python = ">=3.12,<3.13"

# Every range carries an upper bound. Without one, a rebuild months from now
# silently resolves a different major version than the one this code was
# written and tested against — which already happened once here, with openai
# resolving to 2.x from a `>=1.59` floor.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "openai>=2.0,<3",
    "pyyaml>=6.0,<7",
    # Reaches Google Places and Geocoding. Already present transitively via
    # openai, but a transitive dependency is not a promise: this one is called
    # directly, so it carries its own bound.
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "time-machine>=2.16,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
