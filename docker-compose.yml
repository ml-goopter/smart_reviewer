# The API image and its database wiring, shared by the service that serves
# requests and the one-shot that migrates. An anchor rather than a second copy,
# so the two can never drift onto different images or different DATABASE_URLs —
# which would show up as a migration that ran somewhere nothing reads.
x-api: &api
  build:
    context: ./apps/api
    args:
      INSTALL_DEV: 'true'
  # Everything a deployment may override comes from the repo-root .env, whole.
  # Listing variables one by one meant a `${VAR:-default}` fallback beside every
  # one, which is a second place the value was written — and the copies drifted.
  # config.py holds the defaults; this file sets only what it cannot know.
  env_file:
    # Absent on a fresh clone, and the stack should still start: every setting
    # except the two secrets has a working default.
    - path: .env
      required: false
  environment: &api-env
    # Topology, not policy. The code defaults to the host-published port so it
    # runs outside Docker; `db` resolves only inside the compose network.
    DATABASE_URL: postgresql+psycopg://reviewer:reviewer@db:5432/reviewer
    # Where those two files land. Outside Docker the tests walk up instead.
    REPO_ROOT: /repo
  volumes:
    - ./apps/api:/srv
    # Seed data is configuration, not application code, so it lives at the repo
    # root and is mounted read-only rather than copied into the image.
    - ./merchants:/srv/merchants:ro
    # The two repo-level files the config tests read. Only apps/api is mounted,
    # so without these the drift check would silently skip inside the container
    # — which is where the documented `pytest` command runs it.
    - ./.env.example:/repo/.env.example:ro
    - ./docker-compose.yml:/repo/docker-compose.yml:ro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: reviewer
      POSTGRES_DB: reviewer
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 5433 on the host, not 5432: a developer machine usually already has a
    # Postgres on the default port, and config.py's DATABASE_URL default names
    # this one so the API and the tests run outside Docker too.
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reviewer -d reviewer']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Runs the migration once and exits. `docker compose up` blocks the API on it
  # completing successfully, so a fresh clone needs no separate step and the API
  # can never come up against a schema that was never migrated.
  #
  # A one-shot service rather than an entrypoint in the API container: an
  # entrypoint runs once per replica and once per --reload restart, so several
  # workers would race each other into the same `alembic upgrade`. This runs
  # exactly once per `up`, and a failure is visible as a non-zero exit rather
  # than a crash-looping API.
  migrate:
    <<: *api
    command: ['alembic', 'upgrade', 'head']
    # Compose would otherwise treat the clean exit as a crash and start it again.
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    environment:
      <<: *api-env
      # Also topology: true because nginx is in front and overwrites the header.
      # The API defaults it off so anything running without a proxy never
      # believes a client-supplied IP.
      TRUST_PROXY_HEADERS: 'true'
      # No value: a bare key forwards the host's variable into the container and
      # sets nothing when it is unset. This is what makes the documented
      # `LEAD_PROVIDER=fake docker compose up -d api` reach the API — a shell
      # prefix otherwise only feeds Compose's own `${VAR}` interpolation. Never
      # give it a default here; config.py owns that.
      LEAD_PROVIDER:
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Published so `npm run dev` on the host can proxy straight to FastAPI with
    # nginx out of the picture. It also means /api/* is reachable without the
    # proxy — an accepted risk while the crawler endpoints are open (spec
    # §2.1.12), not an oversight.
    ports:
      - '8000:8000'
    # Source mount + reload: the API is the surface that changes most during
    # the build, and rebuilding an image per edit is the slowest possible loop.
    command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000', '--reload']
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request;urllib.request.urlopen(''http://127.0.0.1:8000/api/health'')"']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # nginx and the SPA are one service, because in production the SPA is not a
  # process — it is a directory of files nginx reads. There is no Node runtime
  # to keep alive and nothing for the two to talk to each other about.
  #
  # The stock nginx image plus two mounts, not a built image: the bundle and the
  # config are both inputs nginx reads at request time, so baking them in bought
  # only a rebuild between `npm run build` and seeing the result. Deploying the
  # frontend is `npm run build` in apps/web; nginx serves whatever is in dist on
  # the next request. Run that build first — Docker creates an empty directory
  # for a missing bind source, which serves as 404s rather than an error.
  #
  # This is also the development shape, on purpose. There is no Vite service and
  # no dev overlay: the nginx that answers a developer is the nginx that answers
  # in production, so a route cannot work in one and dead-end in the other. The
  # price is a build per frontend change and no hot reload.
  web:
    image: nginx:1.27-alpine
    volumes:
      # Read-only: nginx never writes to either, and the container has no
      # business modifying the host's build output or its own config.
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ~/goopter.com:/etc/letsencrypt/live/goopter.com:ro
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
