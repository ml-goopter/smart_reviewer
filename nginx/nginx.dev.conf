### Development only. Mounted over nginx.conf by docker-compose.dev.yml.
#
# Same origin, same routing, same reverse proxy as production — the only
# difference is who answers `/`: here it is the Vite dev server, in production
# it is a directory of built files. Keeping nginx in the dev path is the point.
# The alternative (browse Vite on :5173 directly) exercises a different router
# with a different config, which is exactly how a path comes to work in
# development and dead-end in production.
#
# Every `location` here must mirror one in nginx.conf. If you add a route to
# one, add it to the other. The reverse does not hold: production's `/assets/`
# and `= /index.html` are cache rules for files on disk, and here those paths
# are served by Vite through `location /`.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Session tokens travel in the URL path, so the request line is not logged
    # — the same reasoning as production, and it applies to a developer's
    # terminal scrollback too.
    log_format main '$remote_addr - $status $request_method '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # No gzip: Vite serves unminified modules and rewrites them on every edit,
    # so compressing them costs time and buys nothing at localhost bandwidth.

    upstream api {
        server api:8000;
    }

    upstream vite {
        server vite:5173;
    }

    # WebSocket upgrade, for hot module replacement. `Connection` must be
    # "upgrade" only when the client asked for one — sending it unconditionally
    # breaks ordinary requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        proxy_read_timeout 60s;
        client_max_body_size 64k;

        # Same response headers as production. Dev is where a header is noticed
        # missing, and a browser that sniffs types here but not in production is
        # a difference this config exists to avoid.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;

        # --- identical to production ---------------------------------------

        location ~ ^/api(/|$) {
            proxy_pass http://api;
        }

        location ~ ^/m(/|$) {
            proxy_pass http://api;
        }

        # --- the one difference --------------------------------------------

        # Everything else is the SPA. In production this is `try_files $uri
        # /index.html` against a built bundle; here it is a live Vite server,
        # so /leads and /r/:token resolve the same way but the source is the
        # source on disk.
        location / {
            proxy_pass http://vite;

            # Every server-level proxy_set_header has to be repeated here.
            # nginx does not inherit them into a block that declares any of its
            # own, so naming Upgrade below silently drops Host — and Vite then
            # sees a request for the host "vite", which its allowedHosts check
            # rejects outright. Same inheritance rule that bites add_header in
            # the production config.
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;

            # HMR. Without these the page loads and then never updates, which
            # looks like a broken build rather than a missing header.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Vite streams module updates; buffering delays them until the
            # response completes, which for a websocket is never.
            proxy_buffering off;
        }
    }
}
