worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Deliberately logs the method and status but NOT the request line. Session
    # tokens travel in the URL path, so "$request" would write a live
    # capability key into the access log — and into every log shipper, backup,
    # and support paste that follows. The route is identifiable from the
    # upstream and status without recording who it belonged to.
    log_format main '$remote_addr - $status $request_method '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        # listen 443 ssl;
        # http2 on;
        server_name _;

        root /usr/share/nginx/html;

        # ssl_certificate     /etc/letsencrypt/live/goopter.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/goopter.com/privkey.pem;

        # Must stay above the API's own AI provider timeout (ai_timeout_seconds,
        # default 20s) so a slow generation surfaces as the API's own 502 with a
        # usable error contract, rather than an nginx 504 the client can't
        # interpret.
        proxy_read_timeout 60s;

        # Requests carry no uploads; the only bodies are small JSON documents.
        client_max_body_size 64k;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_http_version 1.1;

        # $http_host preserves the port; $host strips it, which turns any
        # absolute redirect into a dead link on non-80 origins like :8080.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Both client-IP headers are overwritten with the peer nginx actually
        # accepted the connection from. Never use $proxy_add_x_forwarded_for
        # here: it appends, leaving a browser-supplied value in the leftmost
        # position, which is exactly where every XFF parser looks for "the
        # client" — that would make the create-session rate limit trivially
        # bypassable by sending your own header.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;

        # Matches /api and /api/... but not /apifoo.
        location ~ ^/api(/|$) {
            proxy_pass http://api;
        }

        # The QR code's destination. Load-bearing: without it the catch-all
        # below answers /m/{uuid} with index.html, and the scan dead-ends on a
        # blank SPA shell at a route the app has no handler for. FastAPI
        # validates the merchant, mints a session, and 302s to /r/:token.
        #
        # Matches /m and /m/... but not /marketing.
        location ~ ^/m(/|$) {
            proxy_pass http://api;
        }

        # Vite emits content-hashed filenames, so these can never go stale.
        # `expires` is not used alongside this: it emits its own Cache-Control,
        # and the response would carry two conflicting ones.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            # Both server-level headers have to be repeated: nginx's add_header
            # does not inherit into a block that declares any of its own, so
            # naming one here silently drops the other.
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # Every SPA route resolves to this file, including /r/:token. It must
        # never be cached: it is the document that names the current asset
        # hashes, so a cached copy pins the browser to a bundle that no longer
        # exists after a deploy.
        location = /index.html {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
